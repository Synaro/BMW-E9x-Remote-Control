[platformio]
default_envs = native

[env]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Wpedantic
build_src_filter =
    +<application/>
    +<domain/>
    +<infrastructure/>
    +<main.cpp>

; Exact bench prototype target. It remains electrically inert and must not be
; connected directly to a vehicle bus or to the vehicle 12 V supply.
[env:esp32s3dev]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<application/>
    +<domain/>
    +<infrastructure/>
    +<main.cpp>
