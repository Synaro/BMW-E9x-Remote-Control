[platformio]
default_envs = native

[env]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Wpedantic
build_src_filter =
    +<application/>
    +<domain/>
    +<infrastructure/>
    +<main.cpp>

; Exact bench prototype target. ESP-IDF 5.5.0 is supplied by the pinned
; PlatformIO platform. The firmware remains electrically inert and must not be
; connected directly to a vehicle bus or to the vehicle 12 V supply.
[env:esp32s3dev]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
