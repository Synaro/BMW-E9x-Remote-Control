[platformio]
default_envs = native

[env]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Wpedantic
build_src_filter =
    +<application/>
    +<infrastructure/>
    +<main.cpp>

; Reference target only. Pin and qualify the exact board before vehicle testing.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
build_src_filter =
    +<application/>
    +<infrastructure/>
    +<main.cpp>
