# BMW E9x Remote Control - configuration sure pour le premier essai USB
# Cette configuration ne doit pas etre utilisee comme profil vehicule qualifie.

remote_start_enabled=false
hood_monitoring=disabled
remote_run_minutes=15
driver_entry_mode=require_takeover
takeover_timeout_seconds=60
lock_press_count=3
lock_minimum_gap_ms=80
lock_maximum_gap_ms=1500
lock_sequence_window_ms=3000
