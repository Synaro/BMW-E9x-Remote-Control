# BMW E9x Remote Control - exemple de configuration utilisateur
# Les valeurs hors limites sont refusées ; elles ne sont jamais corrigées en silence.

remote_start_enabled=true

# required : le signal de capot doit être disponible et fermé
# disabled : le signal de capot est entièrement ignoré
hood_monitoring=disabled

# De 1 à 60 minutes
remote_run_minutes=15

# require_takeover : 60 s pour confirmer la reprise après ouverture d'une porte
# stop_immediately : arrêt dès l'ouverture d'une porte
driver_entry_mode=require_takeover

# De 10 à 300 secondes
takeover_timeout_seconds=60

# De 2 à 5 appuis ; les temporisations sont exprimées en millisecondes
lock_press_count=3
lock_minimum_gap_ms=80
lock_maximum_gap_ms=1500
lock_sequence_window_ms=3000

# Seuils de télémétrie V1 en lecture seule
cold_engine_maximum_rpm=2200
engine_warm_temperature_c=75
transmission_overheat_temperature_c=110
temperature_alert_hysteresis_c=5

# Fonctionnalités modulaires : chaque option est indépendante et désactivée par défaut.
# « bench_only » dans la documentation signifie simulation/banc uniquement tant que
# les signaux et commandes véhicule n'ont pas été qualifiés.

# Sécurité et accès
feature.passive_ble_access=false
feature.sequential_kill_switch=false
feature.alarm_push_notification=false
feature.valet_mode=false
feature.anti_carjacking=false
feature.slam_and_go_lock=false
feature.hands_free_trunk=false
feature.phone_left_behind_alert=false

# Performance, télémétrie et cockpit
feature.needle_sweep=false
feature.external_shift_light=false
feature.android_racing_dashboard=false
feature.steering_wheel_m_mode=false
feature.cold_engine_guard=false
feature.oil_temperature_gauge=false
feature.one_touch_dtc=false
feature.forced_dpf_regeneration=false
feature.dpf_regeneration_indicator=false
feature.active_transmission_cooling=false
feature.transmission_overheat_alert=false
feature.flight_recorder=false
feature.virtual_obd_ble=false
feature.smart_turbo_timer=false

# Éclairage et signalisation
feature.custom_welcome_lighting=false
feature.rapid_headlight_flash=false
feature.four_corner_strobe=false
feature.dynamic_cornering_lights=false
feature.directional_follow_me_home=false
feature.dynamic_ambient_lighting=false

# Confort et automatismes
feature.custom_startup_sequence=false
feature.automatic_defrost=false
feature.dynamic_reverse_tilt=false
feature.rain_window_closure=false
feature.high_speed_window_closure=false
feature.reverse_audio_ducking=false
feature.drive_through_assistant=false
feature.steering_wheel_remap=false
feature.automatic_hotspot=false
feature.smartphone_voice_assistant=false
feature.multi_driver_profiles=false

# Règles et priorités logicielles
feature.smoker_window_override=false
feature.rain_smoker_priority=false
feature.passenger_reverse_tilt_override=false
feature.manual_override_priority=false
