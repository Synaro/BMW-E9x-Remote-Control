name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Test trace importer
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  platformio-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19 intelhex==2.3.0

      - name: Build native target
        run: pio run -e native

      - name: Build ESP32-S3 target
        run: pio run -e esp32s3dev

      - name: Verify ESP32-S3 safety gates
        shell: bash
        run: |
          grep -q '#define CONFIG_TWAI_ERRATA_FIX_LISTEN_ONLY_DOM 1' \
            .pio/build/esp32s3dev/config/sdkconfig.h
          if grep -ERn \
            'twai_(transmit|receive|driver_install|start|node_[a-z_]+)|twai_new_node' \
            src include; then
            echo 'Forbidden TWAI initialization, reception or transmission API in firmware sources.'
            exit 1
          fi
          if pio pkg exec --package toolchain-xtensa-esp-elf -- \
            xtensa-esp32s3-elf-nm -C \
            .pio/build/esp32s3dev/firmware.elf | \
            grep -E 'twai_(transmit|receive|driver_install|start|node_[a-z_]+)|twai_new_node'; then
            echo 'Forbidden TWAI driver symbol linked in firmware.'
            exit 1
          fi

  windows-simulator-gui:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure simulator
        run: cmake -S . -B build -DBMW_REMOTE_BUILD_TESTS=OFF -DBMW_REMOTE_BUILD_CONFIGURATOR=OFF

      - name: Build simulator
        run: cmake --build build --config Release --target bmw_remote_simulator --parallel

      - name: Prepare GUI executable path
        shell: pwsh
        run: Copy-Item build/Release/bmw_remote_simulator.exe build/bmw_remote_simulator.exe

      - name: Verify GUI and simulator contract
        shell: powershell
        run: .\scripts\simulator-gui.ps1 -SkipBuild -SelfTest
