name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Test trace importer
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  platformio-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build native target
        run: pio run -e native

      - name: Build ESP32-S3 target
        run: pio run -e esp32s3dev

  windows-simulator-gui:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure simulator
        run: cmake -S . -B build -DBMW_REMOTE_BUILD_TESTS=OFF -DBMW_REMOTE_BUILD_CONFIGURATOR=OFF

      - name: Build simulator
        run: cmake --build build --config Release --target bmw_remote_simulator --parallel

      - name: Prepare GUI executable path
        shell: pwsh
        run: Copy-Item build/Release/bmw_remote_simulator.exe build/bmw_remote_simulator.exe

      - name: Verify GUI and simulator contract
        shell: powershell
        run: .\scripts\simulator-gui.ps1 -SkipBuild -SelfTest
